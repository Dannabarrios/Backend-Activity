name: CI/CD Hospital Backend

on:
  push:
    branches: [ develop, qa, main ]
  pull_request:
    branches: [ develop, qa, main ]

jobs:
  ci-build:
    name: CI - Compilar y Testear
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: ./mvnw clean compile

      - name: Ejecutar tests
        run: ./mvnw test

      - name: Verificar empaquetado
        run: ./mvnw package -DskipTests

  ci-code-quality:
    name: CI - Calidad de Código
    runs-on: ubuntu-latest
    needs: ci-build

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verificar estructura del proyecto
        run: |
          echo "Verificando estructura N-capas..."
          test -d src/main/java/com/hospital/backend/controller && echo "✅ controller existe"
          test -d src/main/java/com/hospital/backend/service && echo "✅ service existe"
          test -d src/main/java/com/hospital/backend/repository && echo "✅ repository existe"
          test -d src/main/java/com/hospital/backend/model && echo "✅ model existe"
          test -d src/main/java/com/hospital/backend/dto && echo "✅ dto existe"
          test -d src/main/java/com/hospital/backend/mapper && echo "✅ mapper existe"
          test -d src/main/java/com/hospital/backend/config && echo "✅ config existe"

  cd-docker:
    name: CD - Build Docker
    runs-on: ubuntu-latest
    needs: [ ci-build, ci-code-quality ]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: ./mvnw package -DskipTests

      - name: Build imagen Docker
        run: docker build -t hospital-backend:latest .

      - name: Verificar contenedor
        run: |
          docker run -d --name hospital-test \
            -e SPRING_PROFILES_ACTIVE=dev \
            hospital-backend:latest || true
          sleep 10
          docker ps
          docker stop hospital-test || true
          docker rm hospital-test || true
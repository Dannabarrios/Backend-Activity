name: CI/CD Hospital Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: CI - Build y Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar con Maven
        run: mvn clean install -DskipTests

      - name: Ejecutar tests
        run: mvn test

  deploy:
    name: CD - Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t hospital-backend .

      - name: Verificar contenedor
        run: |
          docker run -d --name test-container hospital-backend || true
          sleep 5
          docker ps
          docker stop test-container || true